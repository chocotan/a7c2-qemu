[package]
name = "camera-ui-rs"
version = "0.1.0"
edition = "2021"
description = "Sony ILCE-7CM2 (a7C II) QEMU 原固件机身控制原型（eframe/egui，跨平台）"

[dependencies]
eframe = { version = "0.37", features = ["glow"] }
image = { version = "0.25", default-features = false, features = ["png", "pnm"] }

[profile.release]
opt-level = 2
